<style>
:root {
  --primary: #E07A5F;
  --primary-light: #f09a85;
  --primary-dark: #c4613f;
  --secondary: #3D405B;
  --secondary-light: #5a5d7a;
  --bg: #FAF8F5;
  --card: #FFFFFF;
  --text: #2D2D2D;
  --text-light: #6B7280;
  --border: #E8E4DF;
  --accent-green: #81B29A;
  --accent-yellow: #F2CC8F;
  --accent-purple: #9B8EC4;
  --accent-pink: #E8A0BF;
  --accent-blue: #7EB8DA;
  --shadow: 0 2px 12px rgba(61,64,91,0.08);
  --shadow-hover: 0 6px 24px rgba(61,64,91,0.14);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --font: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
/* ===== Header ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 8px rgba(0,0,0,0.04);
}
.header-inner {
  max-width: 960px; margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-size: 1.3rem; font-weight: 700; color: var(--primary);
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  user-select: none;
}
.logo svg { width: 28px; height: 28px; }
/* ===== Tab Navigation ===== */
.tab-nav {
  max-width: 960px; margin: 0 auto; padding: 0 20px;
  display: flex; gap: 4px; overflow-x: auto;
  scrollbar-width: none; -ms-overflow-style: none;
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0; padding: 12px 20px;
  border: none; background: transparent;
  font-family: var(--font); font-size: 0.9rem; font-weight: 500;
  color: var(--text-light); cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--primary); }
.tab-btn.active {
  color: var(--primary); font-weight: 600;
  border-bottom-color: var(--primary);
}
/* ===== Main Content ===== */
.main { max-width: 960px; margin: 0 auto; padding: 24px 20px 80px; }
.tab-content { display: none; animation: fadeIn 0.35s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* ===== Hero ===== */
.hero {
  text-align: center; padding: 48px 20px 40px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: var(--radius); color: #fff; margin-bottom: 32px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: -50%; right: -20%;
  width: 400px; height: 400px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.hero::after {
  content: ''; position: absolute; bottom: -30%; left: -10%;
  width: 300px; height: 300px; border-radius: 50%;
  background: rgba(255,255,255,0.04);
}
.hero h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 12px; position: relative; }
.hero p { font-size: 0.95rem; opacity: 0.9; line-height: 1.6; position: relative; }
.hero-tags {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  margin-top: 20px; position: relative;
}
.hero-tag {
  padding: 6px 16px; border-radius: 20px;
  background: rgba(255,255,255,0.18); font-size: 0.85rem;
  backdrop-filter: blur(4px); transition: var(--transition);
}
.hero-tag:hover { background: rgba(255,255,255,0.3); }
/* ===== Feature Tags ===== */
.section-title {
  font-size: 1.2rem; font-weight: 600; margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.section-title::before {
  content: ''; width: 4px; height: 20px;
  background: var(--primary); border-radius: 2px;
}
/* ===== Scenario Cards ===== */
.scenario-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.scenario-card {
  background: var(--card); border-radius: var(--radius);
  padding: 24px; cursor: pointer;
  box-shadow: var(--shadow); transition: var(--transition);
  border: 2px solid transparent; position: relative; overflow: hidden;
}
.scenario-card:hover {
  transform: translateY(-4px); box-shadow: var(--shadow-hover);
  border-color: var(--primary-light);
}
.scenario-card .card-icon { font-size: 2.2rem; margin-bottom: 12px; }
.scenario-card h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
.scenario-card p { font-size: 0.85rem; color: var(--text-light); line-height: 1.5; }
.scenario-card .card-badge {
  position: absolute; top: 16px; right: 16px;
  padding: 4px 10px; border-radius: 12px; font-size: 0.75rem;
  background: var(--bg); color: var(--text-light);
}
.region-tag { font-size: 0.85em; cursor: help; vertical-align: middle; }
.alt-region {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 10px 14px;
  background: var(--bg); border-left: 3px solid var(--accent-green);
  border-radius: var(--radius-xs); font-size: 0.9rem;
}
.alt-region .alt-label { color: var(--accent-green); font-weight: 600; white-space: nowrap; }
.alt-region .alt-es { font-weight: 500; }
.alt-region .alt-note { color: var(--text-light); font-size: 0.8rem; }
/* ===== Region Guide ===== */
.region-intro {
  background: var(--card); border-radius: var(--radius); padding: 20px 24px;
  box-shadow: var(--shadow); margin-bottom: 24px; font-size: 0.9rem;
  line-height: 1.7; color: var(--text);
}
.region-section { margin-bottom: 32px; }
.region-section > h3 {
  font-size: 1rem; font-weight: 600; color: var(--secondary);
  margin-bottom: 14px; padding-left: 12px;
  border-left: 3px solid var(--primary);
}
.region-card {
  background: var(--card); border-radius: var(--radius-sm); padding: 16px 20px;
  box-shadow: var(--shadow); margin-bottom: 14px;
}
.region-card h4 { font-size: 0.92rem; color: var(--secondary); margin-bottom: 8px; }
.region-card p { font-size: 0.86rem; color: var(--text-light); line-height: 1.6; }
.region-pair { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.region-pair > div {
  flex: 1 1 200px; padding: 10px 14px; border-radius: var(--radius-xs);
  font-size: 0.88rem;
}
.region-pair .side-es { background: #FDF1EC; border-left: 3px solid var(--primary); }
.region-pair .side-latam { background: #EEF6F2; border-left: 3px solid var(--accent-green); }
.region-pair .side-label { display: block; font-size: 0.72rem; color: var(--text-light); margin-bottom: 4px; }
.region-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.region-table th, .region-table td {
  padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border);
}
.region-table th { background: var(--bg); color: var(--text-light); font-weight: 600; }
.region-table td:first-child { color: var(--text-light); white-space: nowrap; }
.region-warn {
  background: #FEF6E7; border-left: 4px solid var(--accent-yellow);
  border-radius: var(--radius-xs); padding: 14px 18px; margin-bottom: 12px;
}
.region-warn h4 { font-size: 0.9rem; color: var(--secondary); margin-bottom: 6px; }
.region-warn p { font-size: 0.85rem; color: var(--text); line-height: 1.6; }
.region-warn .where { color: var(--primary-dark); font-weight: 600; }
/* ===== Alphabet Section ===== */
.alpha-category { margin-bottom: 32px; }
.alpha-category h3 {
  font-size: 1rem; font-weight: 600; color: var(--secondary);
  margin-bottom: 14px; padding-left: 12px;
  border-left: 3px solid var(--primary);
}
.alpha-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.alpha-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 16px; text-align: center; cursor: pointer;
  box-shadow: var(--shadow); transition: var(--transition);
  border: 2px solid transparent;
}
.alpha-card:hover { border-color: var(--primary-light); transform: scale(1.03); }
.alpha-card .letter {
  font-size: 2rem; font-weight: 700; color: var(--primary);
  margin-bottom: 4px;
}
.alpha-card .phonetic { font-size: 0.8rem; color: var(--text-light); margin-bottom: 6px; }
.alpha-card .example { font-size: 0.85rem; color: var(--secondary); font-weight: 500; }
.alpha-card .example-cn { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
.alpha-card .play-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff; font-size: 0.8rem;
  margin-top: 8px; transition: var(--transition);
}
.alpha-card:hover .play-icon { background: var(--primary-dark); }
/* ===== Vocabulary Section ===== */
.vocab-filter {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
}
.vocab-filter-btn {
  padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--card); font-family: var(--font); font-size: 0.85rem;
  color: var(--text-light); cursor: pointer; transition: var(--transition);
}
.vocab-filter-btn.active, .vocab-filter-btn:hover {
  background: var(--primary); color: #fff; border-color: var(--primary);
}
.vocab-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.vocab-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 16px; box-shadow: var(--shadow); transition: var(--transition);
  display: flex; align-items: center; gap: 12px;
}
.vocab-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.vocab-word { font-size: 1rem; font-weight: 600; color: var(--primary); }
.vocab-cn { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
.vocab-play {
  flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
  border: none; background: var(--bg); color: var(--primary);
  cursor: pointer; font-size: 1rem; transition: var(--transition);
  display: flex; align-items: center; justify-content: center;
}
.vocab-play:hover { background: var(--primary); color: #fff; }
.vocab-search-box {
  margin-bottom: 16px;
}
.vocab-search-input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 0.95rem;
  color: var(--text);
  background: var(--card);
  transition: var(--transition);
  outline: none;
}
.vocab-search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(224,122,95,0.15);
}
.vocab-search-input::placeholder {
  color: var(--text-light);
  opacity: 0.6;
}
/* ===== Translate Section ===== */
.translate-section {
  display: none;
  margin-top: 24px;
  padding: 20px;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.translate-box h4 {
  font-size: 1rem;
  font-weight: 600;
}
.translate-btn {
  margin-top: 10px;
  padding: 10px 24px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-xs);
  font-family: var(--font);
  font-size: 0.9rem;
  cursor: pointer;
  transition: var(--transition);
}
.translate-btn:hover {
  background: var(--primary-dark);
}
.translate-result {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius-xs);
  font-size: 0.95rem;
  line-height: 1.6;
  min-height: 40px;
  color: var(--text);
}
/* ===== Role Play Section ===== */
.rp-scenario-select {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px;
}
.rp-scenario-btn {
  padding: 10px 18px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background: var(--card);
  font-family: var(--font); font-size: 0.9rem; color: var(--text);
  cursor: pointer; transition: var(--transition);
}
.rp-scenario-btn.active { border-color: var(--primary); background: #FFF5F2; color: var(--primary); font-weight: 600; }
.rp-dialogue-select { margin-bottom: 16px; }
.rp-dialogue-select select {
  padding: 10px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--card);
  font-family: var(--font); font-size: 0.9rem; color: var(--text);
  cursor: pointer; min-width: 200px;
}
.chat-container {
  background: var(--card); border-radius: var(--radius);
  padding: 24px; box-shadow: var(--shadow);
  max-height: 600px; overflow-y: auto;
}
.chat-bubble {
  margin-bottom: 16px; display: flex; gap: 10px;
  animation: bubbleIn 0.3s ease;
}
@keyframes bubbleIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.chat-bubble.left { flex-direction: row; }
.chat-bubble.right { flex-direction: row-reverse; }
.chat-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 600; color: #fff; flex-shrink: 0;
}
.chat-bubble.left .chat-avatar { background: var(--secondary); }
.chat-bubble.right .chat-avatar { background: var(--primary); }
.chat-content { max-width: 75%; }
.chat-text {
  padding: 12px 16px; border-radius: 16px;
  font-size: 0.95rem; line-height: 1.5; position: relative;
}
.chat-bubble.left .chat-text { background: var(--bg); border-bottom-left-radius: 4px; }
.chat-bubble.right .chat-text { background: #FFF0EC; border-bottom-right-radius: 4px; }
.chat-cn { font-size: 0.8rem; color: var(--text-light); margin-top: 4px; }
.chat-actions {
  display: flex; gap: 6px; margin-top: 6px;
}
.chat-action-btn {
  padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); font-size: 0.75rem; color: var(--text-light);
  cursor: pointer; transition: var(--transition); font-family: var(--font);
}
.chat-action-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.rp-choices {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
}
.rp-choices p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 10px; }
.rp-choice-btn {
  display: block; width: 100%; padding: 12px 16px; margin-bottom: 8px;
  border-radius: var(--radius-sm); border: 2px solid var(--border);
  background: var(--card); font-family: var(--font); font-size: 0.9rem;
  color: var(--text); cursor: pointer; text-align: left; transition: var(--transition);
}
.rp-choice-btn:hover { border-color: var(--primary); background: #FFF5F2; }
.rp-choice-btn.correct { border-color: var(--accent-green); background: #F0FAF5; }
.rp-choice-btn.wrong { border-color: var(--primary); background: #FFF0EC; }
/* ===== Scenario Detail ===== */
.detail-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
}
.back-btn {
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--card);
  font-family: var(--font); font-size: 0.85rem; color: var(--text);
  cursor: pointer; transition: var(--transition); display: flex;
  align-items: center; gap: 6px;
}
.back-btn:hover { border-color: var(--primary); color: var(--primary); }
.detail-title { font-size: 1.3rem; font-weight: 700; }
.detail-subtitle { font-size: 0.85rem; color: var(--text-light); }
.dialogue-group { margin-bottom: 28px; }
.dialogue-group-title {
  font-size: 0.95rem; font-weight: 600; color: var(--secondary);
  margin-bottom: 14px; padding: 8px 14px;
  background: var(--bg); border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 8px;
}
.sentence-row {
  padding: 14px 16px; margin-bottom: 8px;
  background: var(--card); border-radius: var(--radius-sm);
  box-shadow: var(--shadow); transition: var(--transition);
  cursor: pointer; border-left: 3px solid transparent;
}
.sentence-row:hover { border-left-color: var(--primary); }
.sentence-row.expanded { border-left-color: var(--primary); }
.sentence-es { font-size: 1rem; font-weight: 500; margin-bottom: 4px; }
.sentence-cn { font-size: 0.8rem; color: var(--text-light); }
.sentence-actions {
  display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
}
.sentence-btn {
  padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--card); font-size: 0.78rem; color: var(--text-light);
  cursor: pointer; transition: var(--transition); font-family: var(--font);
  display: flex; align-items: center; gap: 4px;
}
.sentence-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.sentence-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
/* Grammar Breakdown */
.grammar-panel {
  margin-top: 12px; padding: 16px;
  background: #FDF8F6; border-radius: var(--radius-sm);
  display: none; animation: fadeIn 0.25s ease;
}
.grammar-panel.show { display: block; }
.grammar-blocks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.grammar-block {
  padding: 6px 12px; border-radius: 8px; font-size: 0.9rem;
  font-weight: 500; cursor: pointer; transition: var(--transition);
  position: relative;
}
.grammar-block.word { background: #EDE7F6; color: #5E35B1; }
.grammar-block.grammar { background: #FCE4EC; color: #C2185B; }
.grammar-block.ending { background: #E3F2FD; color: #1565C0; }
.grammar-block.fixed { background: #F5F5F5; color: #757575; }
.grammar-block:hover { transform: scale(1.05); }
.grammar-detail {
  padding: 10px 14px; background: var(--card);
  border-radius: var(--radius-xs); font-size: 0.82rem;
  color: var(--text-light); line-height: 1.6;
  border-left: 3px solid var(--accent-purple);
}
.grammar-legend {
  display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px;
  font-size: 0.75rem; color: var(--text-light);
}
.grammar-legend span { display: flex; align-items: center; gap: 4px; }
.grammar-legend .dot {
  width: 10px; height: 10px; border-radius: 3px; display: inline-block;
}
/* Word Swap */
.swap-panel {
  margin-top: 12px; padding: 16px;
  background: #F0F9F6; border-radius: var(--radius-sm);
  display: none; animation: fadeIn 0.25s ease;
}
.swap-panel.show { display: block; }
.swap-panel h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; color: var(--secondary); }
.swap-original { font-size: 0.95rem; margin-bottom: 10px; color: var(--text-light); }
.swap-original .highlight { background: #FFF3E0; padding: 2px 6px; border-radius: 4px; font-weight: 600; color: var(--primary); }
.swap-options { display: flex; flex-wrap: wrap; gap: 8px; }
.swap-option {
  padding: 6px 14px; border-radius: 16px; border: 1.5px solid var(--accent-green);
  background: var(--card); font-size: 0.85rem; color: var(--text);
  cursor: pointer; transition: var(--transition); font-family: var(--font);
}
.swap-option:hover, .swap-option.active { background: var(--accent-green); color: #fff; }
.swap-result {
  margin-top: 12px; padding: 12px; background: var(--card);
  border-radius: var(--radius-xs); font-size: 0.95rem;
  font-weight: 500; border-left: 3px solid var(--accent-green);
}
/* Practice Panel */
.practice-panel {
  margin-top: 12px; padding: 16px;
  background: #FFF8E1; border-radius: var(--radius-sm);
  display: none; animation: fadeIn 0.25s ease;
}
.practice-panel.show { display: block; }
.practice-panel h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: var(--secondary); }
.practice-question { font-size: 0.95rem; margin-bottom: 12px; line-height: 1.6; }
.practice-input {

.practice-option.wrong { border-color: var(--primary); background: #FFEBEE; }
.practice-feedback {
  margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-xs);
  font-size: 0.85rem; display: none;
}
.practice-feedback.show { display: block; }
.practice-feedback.correct { background: #E8F5E9; color: #2E7D32; }
.practice-feedback.wrong { background: #FFEBEE; color: #C62828; }
.practice-next {
  margin-top: 10px; padding: 8px 20px; border-radius: var(--radius-sm);
  border: none; background: var(--primary); color: #fff;
  font-family: var(--font); font-size: 0.85rem; cursor: pointer;
  transition: var(--transition);
}
.practice-next:hover { background: var(--primary-dark); }

  position: fixed; bottom: 0; left: 0; right: 0;

.score-banner.show { transform: translateY(0); }

  margin-bottom: 14px; padding-left: 12px;
  border-left: 3px solid var(--primary);
}
.numbers-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.number-card {
  background: var(--card); border-radius: var(--radius-sm);
  padding: 16px; text-align: center; cursor: pointer;
  box-shadow: var(--shadow); transition: var(--transition);
  border: 2px solid transparent;
}
.number-card:hover { border-color: var(--primary-light); transform: scale(1.03); }
.number-card .digit {

}
.number-card .word { font-size: 0.95rem; color: var(--secondary); font-weight: 500; margin-bottom: 4px; }
.number-card .cn { font-size: 0.75rem; color: var(--text-light); margin-bottom: 8px; }
.number-card .play-icon {
  display: inline-flex; align-items: center; justify-content: center;

  transition: var(--transition);
}
.number-card:hover .play-icon { background: var(--primary-dark); }

.rule-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;

.hidden { display: none !important; }

// ==================== UTILS ====================

// 放进 HTML 属性中的 JS 字符串字面量。数据里存在含 ASCII 双引号的句子
// （如 '... se llama "La Casa".'），不转义会截断 onclick 属性导致按钮失效。
function jsAttr(s) {
  return String(s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/\r?\n/g, ' ');
}

// 作为 HTML 文本内容输出（主要用于翻译接口返回的第三方内容）
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 西语句子归一化：小写、去标点、去重音、压缩空格。用于查表匹配与练习判分。
// ñ 是独立字母而非带重音的 n，需先占位保护再还原。
function normEs(s) {
  return String(s)
    .replace(/ñ/g, '\u0001').replace(/Ñ/g, '\u0002')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u0001/g, 'ñ').replace(/\u0002/g, 'Ñ')
    .toLowerCase()
    .replace(/[¿¡?!.,;:]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// grammarData / swapData 的 key 写的是「裸句」，而对话数据常带前后缀或大小写差异
// （key `¿Cómo estás?` vs 数据 `¡Hola! ¿Cómo estás?`）。原实现用整句全等查表，
// 导致 7 个 key 永远匹配不上。这里按 全等 → 归一化全等 → 归一化子串 逐级降级，
// 子串匹配要求 key 归一化后不少于 8 个字符并取最长命中，避免短 key 误配。
function lookupKey(dict, es) {
  if (dict[es]) return es;
  const n = normEs(es);
  const keys = Object.keys(dict);
  for (const k of keys) if (normEs(k) === n) return k;
  let best = '';
  let bestLen = 0;
  for (const k of keys) {
    const nk = normEs(k);
    if (nk.length >= 8 && nk.length > bestLen && n.includes(nk)) {
      best = k;
      bestLen = nk.length;
    }
  }
  return best;
}

// ==================== SPEECH SYNTHESIS ====================

function speak(text, rate = 1) {
  if (!('speechSynthesis' in window)) {
    showBanner('您的浏览器不支持语音合成功能');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'es-ES';
  utter.rate = rate;
  utter.pitch = 1;
  // Try to find a Spanish voice
  const voices = window.speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang.startsWith('es'));
  if (esVoice) utter.voice = esVoice;
  window.speechSynthesis.speak(utter);
}

  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

let currentTab = 'home';

function switchTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  const tabEl = document.getElementById('tab-' + tabId);
  if (tabEl) tabEl.classList.add('active');
  const btnEl = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
  if (btnEl) btnEl.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderVocabGrid() {
  const grid = document.getElementById('vocabGrid');
  const emptyMsg = document.getElementById('vocabEmpty');
  const searchText = (document.getElementById('vocabSearchInput').value || '').trim().toLowerCase();
  let words = [];
  if (currentVocabCategory === '全部') {
    for (const cat of Object.values(vocabData)) words.push(...cat);
  } else {
    words = vocabData[currentVocabCategory] || [];
  }
  // 搜索过滤
  if (searchText) {
    const normalizedSearch = searchText.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    words = words.filter(w => {
      const normalizedEs = w.es.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
      const normalizedCn = w.cn.toLowerCase();
      return normalizedEs.includes(normalizedSearch) || normalizedCn.includes(searchText) || w.es.toLowerCase().includes(searchText);
    });
  }
  if (words.length === 0) {
    grid.style.display = 'none';
    emptyMsg.style.display = 'block';
    if (searchText) {
      document.getElementById('translateSection').style.display = 'block';
      document.getElementById('translateInput').value = document.getElementById('vocabSearchInput').value;
    }
  } else {
    grid.style.display = '';
    emptyMsg.style.display = 'none';
    document.getElementById('translateSection').style.display = 'none';
    grid.innerHTML = words.map(w => `
      <div class="vocab-card">

          <div class="vocab-cn">${w.cn}</div>
        </div>
        <button class="vocab-play" onclick="event.stopPropagation();speak('${jsAttr(w.es)}')">&#9654;</button>
      </div>
    `).join('');
  }
}

// ==================== TRANSLATE ====================

const TRANSLATE_ENDPOINT = 'https://api.mymemory.translated.net/get';
const LANG_MAP = { zh: 'zh-CN', es: 'es-ES' };
// MyMemory 单次请求的查询长度上限
const TRANSLATE_MAX_BYTES = 500;

async function tryTranslate(input, source, target) {
  const pair = `${LANG_MAP[source]}|${LANG_MAP[target]}`;
  const url = `${TRANSLATE_ENDPOINT}?q=${encodeURIComponent(input)}&langpair=${encodeURIComponent(pair)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.quotaFinished) throw new Error('今日免费翻译额度已用完，请明天再试');
  if (data.responseStatus !== 200 || !data.responseData) {
    throw new Error(data.responseDetails || '翻译服务返回异常');
  }
  return data.responseData.translatedText;
}

function translateText() {
  const input = document.getElementById('translateInput').value.trim();
  const resultDiv = document.getElementById('translateResult');
  if (!input) {
    resultDiv.innerHTML = '<span style="color:var(--text-light)">请输入要翻译的内容</span>';
    return;
  }

  // 检测输入语言
  const hasChinese = /[\u4e00-\u9fff]/.test(input);
  const source = hasChinese ? 'zh' : 'es';
  const target = hasChinese ? 'es' : 'zh';

  if (new TextEncoder().encode(input).length > TRANSLATE_MAX_BYTES) {
    resultDiv.innerHTML = `<span style="color:var(--primary)">单次最多翻译 ${TRANSLATE_MAX_BYTES} 字节（约 160 个汉字），请分段翻译</span>`;
    return;
  }

  resultDiv.innerHTML = '<span style="color:var(--text-light)">翻译中...</span>';

  tryTranslate(input, source, target)
    .then(translated => {
      resultDiv.innerHTML = `
        <div style="margin-bottom:6px;color:var(--text-light);font-size:0.8rem;">${hasChinese ? '中文 → 西班牙语' : 'Español → 中文'}</div>
        <div style="font-size:1.1rem;font-weight:500;">${esc(translated)}</div>
        <button class="sentence-btn" style="margin-top:8px;" onclick="speak('${jsAttr(translated)}')">🔊 听发音</button>
      `;
    })
    .catch(err => {
      resultDiv.innerHTML = `<span style="color:var(--primary)">${esc(err.message || '翻译服务暂时不可用，请稍后重试')}</span>`;
    });
}

let currentRpScenario = 0;
let currentRpDialogue = 0;
let rpStep = 0;
let rpScore = 0;

function renderRpScenarioSelect() {
  const container = document.getElementById('rpScenarioSelect');
  container.innerHTML = scenarios.map((s, i) =>

function selectRpScenario(index) {

  rpStep = 0;
  rpScore = 0;

  renderRpDialogueSelect();

}

function loadRpDialogue() {
  currentRpDialogue = parseInt(document.getElementById('rpDialogueSelect').value);
  rpStep = 0;
  rpScore = 0;
  renderRpChat();
}

function renderRpChat() {
  const container = document.getElementById('rpChatContainer');
  const dialogue = scenarios[currentRpScenario].dialogues[currentRpDialogue];
  let html = '';

  // Show dialogue lines up to current step
  for (let i = 0; i < Math.min(rpStep, dialogue.lines.length); i++) {
    const line = dialogue.lines[i];
    const isRight = line.speaker === 'A';
    html += `
      <div class="chat-bubble ${isRight ? 'right' : 'left'}">
        <div class="chat-avatar">${line.speaker}</div>
        <div class="chat-content">
          <div class="chat-text">${line.es}</div>
          <div class="chat-cn">${line.cn}</div>
          <div class="chat-actions">
            <button class="chat-action-btn" onclick="speak('${jsAttr(line.es)}')">&#128266; 正常</button>
            <button class="chat-action-btn" onclick="speak('${jsAttr(line.es)}', 0.6)">&#128017; 慢速</button>
          </div>
        </div>
      </div>`;
  }

  // Show choices if not finished
  let finished = rpStep >= dialogue.lines.length;
  if (!finished) {
    const currentLine = dialogue.lines[rpStep];
    // 用户扮演 A，其余角色（B / C）都是 NPC
    if (currentLine.speaker !== 'A') {
      html += `
          <div class="chat-bubble left">
            <div class="chat-avatar">${currentLine.speaker}</div>
            <div class="chat-content">
              <div class="chat-text">${currentLine.es}</div>
              <div class="chat-cn">${currentLine.cn}</div>
              <div class="chat-actions">
                <button class="chat-action-btn" onclick="speak('${jsAttr(currentLine.es)}')">&#128266; 正常</button>
                <button class="chat-action-btn" onclick="speak('${jsAttr(currentLine.es)}', 0.6)">&#128017; 慢速</button>
              </div>
            </div>
          </div>`;
      // Find the next A line for choices
      const nextAIndex = dialogue.lines.findIndex((l, idx) => idx > rpStep && l.speaker === 'A');
      if (nextAIndex >= 0) {
        const correctLine = dialogue.lines[nextAIndex];
        const wrongOptions = generateWrongOptions(correctLine, dialogue, nextAIndex);
        const allOptions = shuffleArray([correctLine, ...wrongOptions]).slice(0, 3);
        html += `
          <div class="rp-choices">
            <p>选择你的回复：</p>
            ${allOptions.map((opt, oi) => `
              <button class="rp-choice-btn" data-es="${esc(opt.es)}" onclick="selectRpChoice(this, ${nextAIndex})">
                ${opt.es}<br><small style="color:var(--text-light)">${opt.cn}</small>
              </button>
            `).join('')}
          </div>`;
      } else {
        // 后面没有 A 行了（对话以 NPC 台词收尾），此时应视为对话结束，
        // 否则既不出选项也不出完成面板，用户会卡死无路可走。
        finished = true;
      }
    } else {
      // A's turn - auto show as user
      html += `
        <div class="rp-choices">
          <p>你的回合：</p>
          <button class="rp-choice-btn" onclick="advanceRp()">
            ${currentLine.es}<br><small style="color:var(--text-light)">${currentLine.cn}</small>
          </button>
        </div>`;
    }
  }

  if (finished) {
    const total = rpScorableCount(dialogue);
    // 有的对话（如 ABCBCB 结构）没有需要用户选择的回合，此时不显示得分，避免出现 0/0
    html += `
      <div style="text-align:center;padding:20px;color:var(--accent-green);font-weight:600;">
        ${total > 0 ? `对话完成！得分：${rpScore}/${total}` : '对话完成！'}
      </div>
      <div style="text-align:center;">
        <button class="practice-next" onclick="loadRpDialogue()">重新开始</button>
      </div>`;
  }

  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// 真正需要用户做选择的 A 行数量：前一条为非 A 的 A 行。
// 首条 A 行和连续 A 行走 advanceRp()，不计分，因此不能计入分母。
function rpScorableCount(dialogue) {
  return dialogue.lines.filter(
    (l, i) => l.speaker === 'A' && i > 0 && dialogue.lines[i - 1].speaker !== 'A'
  ).length;
}

function selectRpChoice(btn, correctIndex) {
  const dialogue = scenarios[currentRpScenario].dialogues[currentRpDialogue];
  const correctLine = dialogue.lines[correctIndex];
  const btns = btn.parentElement.querySelectorAll('.rp-choice-btn');

  // 用 data-es 属性比对原文，不依赖 innerHTML 的序列化结果
  const isCorrect = btn.dataset.es === correctLine.es;

  btns.forEach(b => {
    if (b.dataset.es === correctLine.es) b.classList.add('correct');
    else if (b === btn && !isCorrect) b.classList.add('wrong');
    b.disabled = true;
  });

  if (isCorrect) rpScore++;

  rpStep = correctIndex + 1;
  setTimeout(() => renderRpChat(), 1000);
}

function advanceRp() {
  rpStep++;
  renderRpChat();
}

// 干扰项优先取自当前场景的其它 A 行，不足时再从全局补齐。
// 原实现忽略入参、永远从 scenarios[0] 取，导致全站干扰项恒为同两句寒暄。
function generateWrongOptions(correctLine, dialogue, correctIndex) {
  const usable = l => l.speaker === 'A' && l.es !== correctLine.es;
  const sameScene = [];
  for (const d of scenarios[currentRpScenario].dialogues) {
    for (const l of d.lines) if (usable(l)) sameScene.push(l);
  }

  const picked = shuffleArray(sameScene).slice(0, 2);
  if (picked.length < 2) {
    const global = [];
    for (const s of scenarios) {
      for (const d of s.dialogues) {
        for (const l of d.lines) {
          if (usable(l) && !picked.some(p => p.es === l.es)) global.push(l);
        }
      }
    }
    picked.push(...shuffleArray(global).slice(0, 2 - picked.length));
  }
  return picked;
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const fb = document.getElementById(`practice-fb-${di}-${li}`);
  // 归一化后比对：不再因为漏写重音、开头的 ¿ 或句末标点而判错。
  // 判对后仍展示标准答案原文，让用户看到正确的重音写法。
  const correct = normEs(input.value) === normEs(answer);

  fb.className = 'practice-feedback show ' + (correct ? 'correct' : 'wrong');
  fb.textContent = correct
    ? `✅ 正确！标准写法：${answer}`
    : `❌ 不对哦，正确答案是：${answer}`;
  if (correct) showBanner('回答正确！');
}

function checkPracticeChoice(di, li, selectedIndex, correctEs) {
  const panel = document.getElementById(`practice-${di}-${li}`);
  const options = panel.querySelectorAll('.practice-option');
  const fb = document.getElementById(`practice-fb-${di}-${li}`);

  options.forEach((opt, i) => {
    const optText = opt.textContent.trim();
    if (optText === correctEs) opt.classList.add('correct');
    else if (i === selectedIndex) opt.classList.add('wrong');
    opt.disabled = true;
  });

  const selectedText = options[selectedIndex].textContent.trim();
  const isCorrect = selectedText === correctEs;
  fb.className = 'practice-feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.textContent = isCorrect ? '✅ 正确！' : `❌ 不对哦，正确答案是：${correctEs}`;
  if (isCorrect) showBanner('回答正确！');
}

function findSentenceKey(di, li) {
  const scenario = scenarios.find(s => s.id === currentScenarioId);
  if (!scenario) return '';
  return lookupKey(grammarData, scenario.dialogues[di].lines[li].es);
}

// ==================== BANNER ====================

function showBanner(msg) {
  const banner = document.getElementById('scoreBanner');
  banner.textContent = msg;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2000);
}

function renderRegionGuide() {
  const container = document.getElementById('regionContent');
  let html = `<div class="region-intro">${regionData.intro}</div>`;

  const pairBlock = (item) => `
    <div class="region-card">
      <h4>${item.title}</h4>
      <p>${item.desc}</p>
      <div class="region-pair">
        <div class="side-es">
          <span class="side-label">&#127466;&#127480; 西班牙</span>${item.es}
          <button class="sentence-btn" style="margin-top:6px;" onclick="speak('${jsAttr(item.es)}')">&#128266;</button>
        </div>
        <div class="side-latam">
          <span class="side-label">&#127758; 拉美</span>${item.latam}
          <button class="sentence-btn" style="margin-top:6px;" onclick="speak('${jsAttr(item.latam)}')">&#128266;</button>
        </div>
      </div>
      ${item.note ? `<p>${item.note}</p>` : ''}
    </div>`;

  html += `<div class="region-section"><h3>&#128101; 人称与动词变位</h3>
    ${regionData.persons.map(pairBlock).join('')}</div>`;

  html += `<div class="region-section"><h3>&#128264; 发音差异</h3>
    ${regionData.pronunciation.map(p => `
      <div class="region-card">
        <h4>${p.title}</h4>
        <p>${p.desc}</p>
        <p style="margin-top:8px;color:var(--secondary);">${p.example}</p>
      </div>`).join('')}</div>`;

  html += `<div class="region-section"><h3>&#9203; 时态使用习惯</h3>
    ${pairBlock(regionData.tense)}</div>`;

  html += `<div class="region-section"><h3>&#128214; 常用词对照</h3>
    ${regionVocab.map(g => `
      <div class="region-card">
        <h4>${g.group}</h4>
        <table class="region-table">
          <thead><tr><th>中文</th><th>&#127466;&#127480; 西班牙</th><th>&#127758; 拉美</th></tr></thead>
          <tbody>${g.items.map(it => `
            <tr><td>${it.cn}</td><td>${it.es}</td><td>${it.latam}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>`).join('')}</div>`;

  html += `<div class="region-section"><h3>&#9888;&#65039; 用词雷区</h3>

      同一个词在不同国家可能从日常用语变成粗俗语。出发前扫一眼这几个。</p>

        <p style="margin-top:6px;">涉及地区：<span class="where">${w.where}</span></p>
      </div>`).join('')}</div>`;

  container.innerHTML = html;
}
